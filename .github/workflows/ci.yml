name: security-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # weekly re-audit of pinned libraries
  workflow_dispatch:

# Least privilege: the workflow can only read the repository.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (no credentials kept)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned libraries (lockfile only, no install scripts)
        working-directory: tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit shipped libraries for known vulnerabilities
        working-directory: tooling
        run: npm audit --omit=dev --audit-level=moderate

      - name: Verify npm registry signatures
        working-directory: tooling
        run: npm audit signatures

      - name: Reproducible build - published files must match sources + lockfile
        run: |
          python3 tooling/build.py
          git diff --exit-code -- site || { echo "::error::site/ differs from a clean build. Run tooling/build.py and commit."; exit 1; }

      - name: Security policy checks (CSP, headers, no inline/third-party code, integrity)
        run: bash tooling/verify.sh
